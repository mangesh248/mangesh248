name: Generate GitHub Metrics

on:
  schedule:
    # Runs automatically every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate GitHub Metrics SVG (including Private Repositories)
        uses: lowlighter/metrics@latest
        with:
          # Uses METRICS_TOKEN if provided (to include private repositories), otherwise falls back to GITHUB_TOKEN
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          
          # Output settings
          filename: github-metrics.svg
          output_action: commit
          committer_branch: metrics-output
          committer_message: "Update GitHub Metrics [skip ci]"
          
          # Core configuration
          user: mangesh248
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_twemoji: yes
          config_order: base.header, isocalendar, languages, habits
          
          # Most Used Languages (including private repos)
          plugin_languages: yes
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          
          # Lines of code added/deleted
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base
          
          # 3D Isometric Contribution Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # Coding Habits (most active hours and days of the week)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
